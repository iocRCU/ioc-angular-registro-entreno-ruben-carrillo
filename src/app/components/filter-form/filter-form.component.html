<section class="filter-container">
  <h2>Filtres</h2>

  <form #filtroForm="ngForm" (ngSubmit)="emitFilter()">
    <div class="form-group">
      <label for="searchText">Cerca per text</label>
      <input
        id="searchText"
        name="searchText"
        type="text"
        [ngModel]="searchText"
        (ngModelChange)="onSearchChange($event)"
        required
        minlength="2"
      />
      @if (searchText.length > 0 && searchText.length < MIN_LENGTH) {
        <small class="error" role="alert">Calen com a mínim 2 caràcters.</small>
      }
    </div>

    <div class="form-group">
      <label for="categoria">Categoria</label>
      <select
        id="categoria"
        name="categoria"
        [ngModel]="categoria"
        (ngModelChange)="onCategoriaChange($event)"
      >
        <option value="">Totes</option>
        @for (cat of categorias; track cat) {
          <option [value]="cat">{{ cat }}</option>
        }
      </select>
    </div>

    <div class="actions">
      <button type="submit" [disabled]="filtroForm.invalid">Aplicar</button>
      <button type="button" (click)="reset()">Restablir</button>
    </div>
  </form>
</section>
