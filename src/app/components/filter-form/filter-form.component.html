<section class="filter-container" aria-labelledby="filtres-title">
  <h2 id="filtres-title">Filtres</h2>

  <form #filtroForm="ngForm" (ngSubmit)="emitFilter()">
    <div class="form-group">
      <label for="searchText">Cerca per text</label>
      <input
        id="searchText"
        name="searchText"
        type="text"
        [ngModel]="searchText"
        (ngModelChange)="onSearchChange($event)"
        required
        minlength="2"
        #textoInput="ngModel"
      />
      
      @if (isTextInvalid) {
        <small class="error" role="alert">
          Calen com a mínim {{ MIN_LENGTH }} caràcters. Has introduït {{ searchText.length }}
        </small>
      }
    </div>

    <div class="form-group">
      <label for="categoria">Categoria</label>
      <select
        id="categoria"
        name="categoria"
        [ngModel]="categoria"
        (ngModelChange)="onCategoriaChange($event)"
      >
        <option value="">Totes</option>
        @for (cat of categorias; track cat) {
          <option [value]="cat">{{ cat }}</option>
        }
      </select>
    </div>

    <div class="actions">
      <button type="submit" [disabled]="isSubmitDisabled">Aplicar</button>
      <button type="button" (click)="reset()">Restablir</button>
    </div>
  </form>
</section>
